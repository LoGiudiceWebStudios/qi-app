{{ template "layout_top" . }}

<h1 class="text-3xl font-bold mb-6">Nuovo Evento</h1>

<div class="bg-white rounded shadow-md w-full max-w-lg p-6">
    <form action="/admin/events" method="POST" class="space-y-4">
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2" for="titolo">Titolo</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="titolo" type="text" placeholder="Nome dell'evento" required>
        </div>
        
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2" for="descrizione">Descrizione</label>
            <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="descrizione" rows="4" placeholder="Dettagli..." required></textarea>
        </div>

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2" for="data_evento">Data Evento</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="data_evento" type="date" required>
        </div>

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2" for="ora_evento">Ora Evento</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="ora_evento" type="time" required>
        </div>

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2" for="luogo">Luogo</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="luogo" type="text" placeholder="Es: Piazza Roma, Roma">
        </div>

        <div class="flex items-center justify-between pt-4 border-t border-gray-200">
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                Salva Evento
            </button>
            <a href="/admin/events" class="inline-block align-baseline font-bold text-sm text-gray-500 hover:text-gray-800">
                Annulla
            </a>
        </div>
    </form>
</div>

{{ template "layout_bottom" . }}
