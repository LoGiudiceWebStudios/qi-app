{{ template "layout_top" . }}

<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-xl font-bold text-gray-800">Modifica Categoria</h2>
    </div>

    <form action="/admin/menu/categories/{{.Category.ID}}/edit" method="POST" enctype="multipart/form-data" class="p-6 space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome Categoria</label>
            <input type="text" name="name" value="{{.Category.Name}}" required class="w-full px-4 py-2 border border-gray-300 rounded-md">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descrizione / Sottotitolo</label>
            <input type="text" name="description" value="{{.Category.Description}}" class="w-full px-4 py-2 border border-gray-300 rounded-md">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Immagine (Lascia vuoto per mantenere attuale)</label>
            {{if .Category.ImageURL}}
            <div class="mb-3">
                <img src="{{.Category.ImageURL}}" alt="Immagine" class="w-24 h-24 object-cover rounded shadow">
            </div>
            {{end}}
            <input type="file" name="immagine" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-md bg-white">
        </div>

        <div class="pt-4 border-t border-gray-200 flex justify-end gap-3">
            <a href="/admin/menu" class="px-4 py-2 bg-gray-100 text-gray-700 font-medium rounded-md hover:bg-gray-200 transition-colors">Annulla</a>
            <button type="submit" class="px-4 py-2 bg-green-500 text-white font-medium rounded-md hover:bg-green-600 transition-colors">Salva Modifiche</button>
        </div>
    </form>
</div>

{{ template "layout_bottom" . }}
