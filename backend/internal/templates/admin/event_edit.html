{{ template "layout_top" . }}

<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md mt-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Modifica Evento</h2>
        <a href="/admin/events" class="text-gray-500 hover:text-gray-800">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </a>
    </div>

    <form action="/admin/events/{{.Event.ID}}/edit" method="POST" enctype="multipart/form-data" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Titolo</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="titolo" type="text" value="{{.Event.Titolo}}" required>
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Immagine Copertina (Lascia vuoto per mantenere)</label>
                {{if .Event.ImmagineURL}}
                <div class="mb-2">
                    <img src="{{.Event.ImmagineURL}}" alt="Immagine attuale" class="w-16 h-16 object-cover rounded shadow">
                </div>
                {{end}}
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="immagine" type="file" accept="image/*">
            </div>
        </div>
        
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Descrizione</label>
            <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="descrizione" rows="4" required>{{.Event.Descrizione}}</textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Data Evento</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="data_evento" type="date" value="{{.Event.DataEvento.Format "2006-01-02"}}" required>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Ora Evento</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="ora_evento" type="time" value="{{.Event.Ora}}" required>
            </div>
        </div>

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Luogo</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" name="luogo" type="text" value="{{.Event.Luogo}}">
        </div>

        <div class="flex items-center justify-end mt-6 border-t pt-4">
            <a href="/admin/events" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded mr-2">Annulla</a>
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit">Salva Modifiche</button>
        </div>
    </form>
</div>
