{{ template "layout_top" . }}

<div class="max-w-2xl bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-xl font-bold text-gray-800">Modifica Offerta</h2>
    </div>

    <form action="/admin/offers/{{.Offer.ID}}/edit" method="POST" enctype="multipart/form-data" class="p-6 space-y-6">
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Titolo</label>
            <input type="text" name="titolo" value="{{.Offer.Titolo}}" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500 outline-none transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descrizione</label>
            <textarea name="descrizione" rows="4" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500 outline-none transition-all">{{.Offer.Descrizione}}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Valida Dal</label>
                <input type="date" name="valida_dal" value="{{.Offer.ValidaDal.Format "2006-01-02"}}" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Valida Fino Al</label>
                <input type="date" name="valida_fino" value="{{.Offer.ValidaFino.Format "2006-01-02"}}" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500 outline-none transition-all">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Codice Sconto (Opzionale)</label>
            <input type="text" name="codice_sconto" value="{{.Offer.CodiceSconto}}" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="Es: QI-SCONTO-20">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Immagine Offerta (Lascia vuoto per mantenere)</label>
            {{if .Offer.ImmagineURL}}
            <div class="mb-3">
                <img src="{{.Offer.ImmagineURL}}" alt="Immagine attuale" class="h-20 object-cover rounded-md border border-gray-300">
            </div>
            {{end}}
            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md hover:border-green-400 transition-colors">
                <div class="space-y-1 text-center">
                    <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <div class="flex text-sm text-gray-600 justify-center">
                        <label for="immagine" class="relative cursor-pointer bg-white rounded-md font-medium text-green-600 hover:text-green-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-green-500">
                            <span>Carica un file</span>
                            <input id="immagine" name="immagine" type="file" class="sr-only" accept="image/*">
                        </label>
                        <p class="pl-1">o trascina e rilascia</p>
                    </div>
                    <p class="text-xs text-gray-500">PNG, JPG, WEBP fino a 10MB</p>
                </div>
            </div>
        </div>

        <div class="pt-4 border-t border-gray-200 flex justify-end gap-3">
            <a href="/admin/offers" class="px-4 py-2 bg-gray-100 text-gray-700 font-medium rounded-md hover:bg-gray-200 transition-colors">Annulla</a>
            <button type="submit" class="px-4 py-2 bg-green-500 text-white font-medium rounded-md hover:bg-green-600 transition-colors shadow-sm">
                Salva Modifiche
            </button>
        </div>

    </form>
</div>

{{ template "layout_bottom" . }}
