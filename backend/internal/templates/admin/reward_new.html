{{ template "layout_top" . }}

<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Crea Nuovo Premio</h2>

    {{ if .Error }}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        {{ .Error }}
    </div>
    {{ end }}

    <form action="/admin/rewards" method="POST" enctype="multipart/form-data" class="space-y-6">
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Titolo Premio</label>
            <input type="text" name="titolo" required class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-green-500 focus:border-green-500" placeholder="es. Choco Donut Gratis">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Descrizione</label>
            <textarea name="descrizione" required rows="4" class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-green-500 focus:border-green-500" placeholder="Dettagli del premio e condizioni..."></textarea>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Punti Richiesti</label>
            <input type="number" name="punti_richiesti" min="1" required class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-green-500 focus:border-green-500" placeholder="es. 100">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Immagine (Opzionale)</label>
            <input type="file" accept="image/*" name="immagine" class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-green-500 focus:border-green-500">
            <p class="text-xs text-gray-500 mt-1">Carica un'immagine per il premio dal tuo computer.</p>
        </div>

        <div class="flex items-center gap-4 pt-4 border-t border-gray-200">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow transition">Crea Premio</button>
            <a href="/admin/rewards" class="text-gray-600 hover:text-gray-800 font-semibold px-4 py-2 transition">Annulla</a>
        </div>
    </form>
</div>

{{ template "layout_bottom" . }}
