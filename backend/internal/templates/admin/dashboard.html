{{ template "layout_top" . }}

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    
    <!-- Box 1 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex items-center justify-between">
        <div>
            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Eventi Attivi</p>
            <p class="mt-2 text-3xl font-semibold text-gray-900">{{ .TotalEvents }}</p>
        </div>
        <div class="p-3 bg-green-50 text-green-500 rounded-full">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
    </div>

    <!-- Box 2 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex items-center justify-between">
        <div>
            <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Offerte Attive</p>
            <p class="mt-2 text-3xl font-semibold text-gray-900">{{ .TotalOffers }}</p>
        </div>
        <div class="p-3 bg-yellow-50 text-yellow-500 rounded-full">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
    </div>
</div>

<div class="bg-white shadow-sm border border-gray-200 rounded-lg p-6 mb-8">
    <h2 class="text-xl text-gray-800 font-semibold mb-4 leading-loose">Pannello di controllo</h2>
   
</div>

</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
<div class="bg-white shadow-sm border border-gray-200 rounded-lg p-6">
    <h2 class="text-xl text-gray-800 font-semibold mb-4">Stato Locale & Orari</h2>
    <form action="/admin/settings" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Forza Stato</label>
            <select name="forced_status" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm rounded-md">
                <option value="auto" {{ if eq .ForcedStatus "auto" }}selected{{ end }}>Automatico (in base a orari)</option>
                <option value="open" {{ if eq .ForcedStatus "open" }}selected{{ end }}>Forza Aperto</option>
                <option value="closed" {{ if eq .ForcedStatus "closed" }}selected{{ end }}>Forza Chiuso</option>
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Orario Apertura</label>
                <input type="time" name="opening_time" value="{{ .OpeningTime }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Orario Chiusura</label>
                <input type="time" name="closing_time" value="{{ .ClosingTime }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
            </div>
        </div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
            Salva Impostazioni
        </button>
    </form>
</div>

<div class="bg-white shadow-sm border border-gray-200 rounded-lg p-6">
    <h2 class="text-xl text-gray-800 font-semibold mb-4 leading-loose">Convalida Offerte</h2>
    <p class="text-gray-600 mb-4 inline-block text-sm">
        Inserisci il codice mostrato dal cliente per convalidarlo oppure scansiona il QR Code.
    </p>

    <!-- Scanner container -->
    <div id="reader" style="width: 100%; display: none;" class="mb-4"></div>

    <div class="mb-4 flex space-x-2">
      <input type="text" id="offerCode" placeholder="QROFF-XYZ123" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
      <button onclick="validateCode()" class="mt-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded shadow-sm text-sm font-medium whitespace-nowrap">Convalida</button>
    </div>
    
    <button id="scanButton" onclick="startScanner()" class="w-full justify-center flex items-center bg-gray-600 hover:bg-gray-700 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white transition-colors">
        <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
        Scansiona QR Code
    </button>
    <div id="validateResult" class="mt-4 text-sm font-medium hidden p-3 rounded"></div>
</div>
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    let html5QrcodeScanner = null;

    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById("offerCode").value = decodedText;
        if(html5QrcodeScanner) {
            html5QrcodeScanner.clear();
            document.getElementById("reader").style.display = "none";
        }
        validateCode();
    }

    function onScanFailure(error) {
        // handle scan failure
    }

    function startScanner() {
        document.getElementById("reader").style.display = "block";
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    async function validateCode() {
        const code = document.getElementById('offerCode').value;
        if (!code) return;

        const resDiv = document.getElementById('validateResult');
        resDiv.classList.remove("hidden", "bg-green-100", "text-green-800", "bg-red-100", "text-red-800");

        try {
            const req = await fetch('/admin/offers/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });

            const response = await req.json();

            if (req.ok) {
                resDiv.classList.add("bg-green-100", "text-green-800");
                resDiv.innerText = `Successo! ${response.message}. Offerta: ${response.data.offer_title}`;
            } else {
                resDiv.classList.add("bg-red-100", "text-red-800");
                resDiv.innerText = `Errore: ${response.message || response.error}`;
            }
        } catch (e) {
            resDiv.classList.add("bg-red-100", "text-red-800");
            resDiv.innerText = `Errore di rete`;
        }
        resDiv.style.display = "block";
    }
</script>

{{ template "layout_bottom" . }}
