{{ template "layout_top" . }}

<h2 class="text-2xl font-semibold text-gray-800 mb-6">Lista Utenti Registrati</h2>

<div class="bg-white shadow-sm border border-gray-200 rounded-lg overflow-hidden">
    <table class="min-w-full divide-y border-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cognome</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Telefono</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Punti</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y border-gray-200">
            {{ range .Users }}
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ .ID }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ .Nome }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ .Cognome }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ .Email }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ .Telefono }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-green-600">{{ .Punti }}</td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500">Nessun utente trovato.</td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</div>

{{ template "layout_bottom" . }}
