services:
  db:
    image: postgres:15-alpine
    container_name: qi_postgres
    restart: always
    environment:
      - POSTGRES_USER=qi_user
      - POSTGRES_PASSWORD=qi_password
      - POSTGRES_DB=qi_db
    ports:
      - '5433:5432'  # <-- OFFSET: 5433 invece di 5432 per evitare conflitti con Directa
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: qi_backend
    ports:
      - '8081:8080'  # <-- OFFSET: 8081 invece di 8080
    environment:
      - DB_HOST=db
      - DB_USER=qi_user
      - DB_PASSWORD=qi_password
      - DB_NAME=qi_db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
