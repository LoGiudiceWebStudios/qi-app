name: frontend
description: "A new Flutter project for QI."
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  http: ^1.6.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.0.0
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^10.1.0
  google_sign_in: 6.2.1
  sign_in_with_apple: ^8.0.0
  dio: ^5.9.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  package_info_plus: ^10.1.0
  firebase_remote_config: ^6.5.1
  url_launcher: ^6.3.2
  model_viewer_plus: ^1.10.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  quick_look: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo1024.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/DeliciousBurger.png
    - assets/images/
    - assets/icons/
  fonts:
    - family: Open Sauce
      fonts:
        - asset: assets/fonts/OpenSauceOne-Regular.ttf
        - asset: assets/fonts/OpenSauceOne-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSauceOne-Medium.ttf
          weight: 500
