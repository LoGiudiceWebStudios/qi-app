name: frontend
description: "A new Flutter project for QI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  http: ^1.6.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/DeliciousBurger.png
    - assets/images/
    - assets/icons/
  fonts:
    - family: Open Sauce
      fonts:
        - asset: assets/fonts/OpenSauceOne-Regular.ttf
        - asset: assets/fonts/OpenSauceOne-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSauceOne-Medium.ttf
          weight: 500
